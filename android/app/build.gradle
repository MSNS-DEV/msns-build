apply plugin: 'com.android.application'

android {
    namespace = "com.msns.lms"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.msns.lms"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 26
        versionName "1.4.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Signing secrets are never committed. Provide them either in
            // android/keystore.properties (gitignored) or as environment variables:
            //   MSNS_KEYSTORE_FILE, MSNS_KEYSTORE_PASSWORD, MSNS_KEY_ALIAS, MSNS_KEY_PASSWORD
            def ksProps = new Properties()
            def ksPropsFile = rootProject.file('keystore.properties')
            if (ksPropsFile.exists()) {
                ksPropsFile.withInputStream { ksProps.load(it) }
            }
            def ksValue = { String prop, String env -> ksProps.getProperty(prop) ?: System.getenv(env) }
            def ksFile = ksValue('storeFile', 'MSNS_KEYSTORE_FILE') ?: 'msns-release-key.keystore'
            def ksPassword = ksValue('storePassword', 'MSNS_KEYSTORE_PASSWORD')
            def ksAlias = ksValue('keyAlias', 'MSNS_KEY_ALIAS') ?: 'msns-key-alias'
            def ksKeyPassword = ksValue('keyPassword', 'MSNS_KEY_PASSWORD')
            if (ksPassword && ksKeyPassword) {
                storeFile file(ksFile)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (!signingConfigs.release.storePassword) {
                // Fail release builds clearly instead of producing an unsigned/debug-signed bundle.
                gradle.taskGraph.whenReady { graph ->
                    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
                        throw new GradleException("Release signing is not configured. Create android/keystore.properties " +
                            "(storeFile, storePassword, keyAlias, keyPassword) or set MSNS_KEYSTORE_PASSWORD and MSNS_KEY_PASSWORD.")
                    }
                }
            }
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation platform('com.google.firebase:firebase-bom:33.9.0')
    implementation 'com.google.firebase:firebase-common'
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
